[project]
name = "wp2tt"
description = "Convert word processor files to InDesign Tagged Text"
version = "1.11"
authors = [{name="Erez Volk", email="erez.volk@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cairosvg",
  "lxml",
  "mistune",
  "pandas",
  "types-lxml>=2026.2.16",
  "ziamath",
]

[project.scripts]
wp2tt = "wp2tt:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pylint.MASTER]
extension-pkg-allow-list = [
    "lxml",
]

[tool.pylint.messages_control]
max-line-length = 88
disable = [
  "too-few-public-methods",
  "too-many-instance-attributes",
  "too-many-public-methods",
]

[[tool.mypy.overrides]]
module = [
    "markdown.*",
    "mistune.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.14"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
   "ANN002",  # Missing type annotation for `*args`
   "ANN003",  # Missing type annotation for `**kwargs`
   "CPY001",  # Missing copyright
   "C901",  # Too many branches
   "D102",
   "D105",
   "D107",
   "D203",
   "D213",
   "E203",  # Whitespace before :
   "EM101",
   "EM102",
   "I001",
   "PLR0911",  # Too many returns
   "PLR0912",  # Too many branches
   "S101",
   "S311",
   "S324",
   "SIM102",
   "SLF001",  # Private member access
   "T201",
   "TRY003" ,
]
